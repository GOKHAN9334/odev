<!doctype html>
<html lang="tr" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çıkarma İşlemi Uygulaması</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
        body {
            box-sizing: border-box;
        }
        
        .math-input {
            width: 80px;
            height: 60px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            -moz-appearance: textfield;
        }
        
        .math-input::-webkit-outer-spin-button,
        .math-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        .math-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .math-input.correct {
            border-color: #10b981;
            background-color: #f0fdf4;
        }
        
        .math-input.incorrect {
            border-color: #ef4444;
            background-color: #fef2f2;
        }
        
        .vertical-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        .horizontal-layout {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .minus-sign {
            font-size: 32px;
            font-weight: bold;
            color: #374151;
        }
        
        .plus-sign {
            font-size: 32px;
            font-weight: bold;
            color: #374151;
        }
        
        .equals-sign {
            font-size: 32px;
            font-weight: bold;
            color: #374151;
        }
        
        .line-under {
            width: 100%;
            height: 3px;
            background-color: #374151;
            margin: 4px 0;
        }

        .problem-grid {
            width: 100%;
        }

        .problem-card-wrapper {
            padding: 0.35rem;
        }

        .problem-card {
            width: 100%;
        }
    </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full bg-gradient-to-br from-blue-50 to-indigo-100">
  <main class="container mx-auto px-4 py-8 h-full">
   <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-8">
    <header class="text-center mb-8">
     <h1 id="app-title" class="text-4xl font-bold text-gray-800 mb-4">Matematik İşlemleri Uygulaması</h1>
     <p class="text-lg text-gray-600">1, 2 veya 3 basamaklı sayılarla toplama ve çıkarma işlemi pratiği yapın</p>
    </header><!-- Ayarlar Paneli -->
    <div class="bg-gray-50 rounded-xl p-6 mb-8">
     <h2 class="text-xl font-semibold text-gray-700 mb-4">⚙️ Ayarlar</h2>
     <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-6"><!-- İşlem Türü -->
      <div><label class="block text-sm font-medium text-gray-700 mb-2">İşlem Türü</label> <select id="problem-type" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"> <option value="subtraction-result">Çıkarma - Sonucu Bul</option> <option value="subtraction-minuend">Çıkarma - Eksileni Bul</option> <option value="subtraction-subtrahend">Çıkarma - Çıkanı Bul</option> <option value="addition-result">Toplama - Sonucu Bul</option> <option value="addition-first-addend">Toplama - 1. Toplanı Bul</option> <option value="addition-second-addend">Toplama - 2. Toplanı Bul</option> </select>
      </div><!-- İşlem Sayısı -->
      <div><label class="block text-sm font-medium text-gray-700 mb-2">Soru Sayısı</label> <select id="problem-count" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"> <option value="1" selected>1 Soru</option> <option value="5">5 Soru</option> <option value="10">10 Soru</option> <option value="15">15 Soru</option> <option value="20">20 Soru</option> <option value="25">25 Soru</option> <option value="30">30 Soru</option> <option value="40">40 Soru</option> <option value="50">50 Soru</option> </select>
      </div><!-- Basamak Sayısı -->
      <div><label class="block text-sm font-medium text-gray-700 mb-2">Basamak Sayısı</label> <select id="digit-count" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"> <option value="1">1 Basamak (1-9)</option> <option value="2">2 Basamak (10-99)</option> <option value="3" selected>3 Basamak (100-999)</option> </select>
      </div><!-- Düzen -->
      <div><label class="block text-sm font-medium text-gray-700 mb-2">İşlem Düzeni</label> <select id="layout-type" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"> <option value="vertical">Alt Alta</option> <option value="horizontal">Yan Yana</option> </select>
      </div><!-- Font Boyutu -->
      <div><label class="block text-sm font-medium text-gray-700 mb-2">Yazı Boyutu</label> <select id="font-size" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"> <option value="18">Küçük</option> <option value="24" selected>Orta</option> <option value="30">Büyük</option> <option value="36">Çok Büyük</option> </select>
      </div>
     </div>
    </div><!-- İşlem Alanı -->
    <div class="bg-blue-50 rounded-xl p-8 mb-6">
     <div id="problem-container" class="vertical-layout problem-grid"><!-- İşlem buraya dinamik olarak yüklenecek -->
     </div>
    </div><!-- Kontrol Butonları -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center"><button id="check-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg transition-colors duration-200 shadow-lg"> Kontrol Et </button> <button id="new-problem-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition-colors duration-200 shadow-lg"> Yeni Soru </button>
    </div><!-- Sonuç Mesajı -->
    <div id="result-message" class="mt-6 text-center text-lg font-semibold hidden"></div>
   </div>
  </main>
  <script>
        // Konfigürasyon
        const defaultConfig = {
            app_title: "Matematik İşlemleri Uygulaması",
            check_button_text: "Kontrol Et",
            new_problem_text: "Yeni Soru",
            primary_color: "#3b82f6",
            secondary_color: "#10b981",
            background_color: "#f8fafc",
            text_color: "#1f2937",
            accent_color: "#ef4444",
            font_family: "system-ui",
            font_size: 16
        };

        let currentProblems = [];
        let currentLayout = 'vertical';
        let currentProblemType = 'subtraction-result';
        let currentFontSize = 24;
        let currentDigitCount = 3;
        let currentProblemCount = 1;

        // Element SDK başlatma
        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                onConfigChange: async (config) => {
                    const customFont = config.font_family || defaultConfig.font_family;
                    const baseSize = config.font_size || defaultConfig.font_size;
                    const baseFontStack = 'system-ui, -apple-system, sans-serif';

                    // Başlık güncelleme
                    document.getElementById('app-title').textContent = config.app_title || defaultConfig.app_title;
                    document.getElementById('app-title').style.fontFamily = `${customFont}, ${baseFontStack}`;
                    document.getElementById('app-title').style.fontSize = `${baseSize * 2}px`;

                    // Buton metinleri güncelleme
                    document.getElementById('check-btn').textContent = config.check_button_text || defaultConfig.check_button_text;
                    document.getElementById('new-problem-btn').textContent = config.new_problem_text || defaultConfig.new_problem_text;

                    // Renkler güncelleme
                    document.body.style.background = `linear-gradient(to bottom right, ${config.background_color || defaultConfig.background_color}, ${config.primary_color || defaultConfig.primary_color}20)`;
                    
                    // Buton renklerini güncelle
                    const checkBtn = document.getElementById('check-btn');
                    const newProblemBtn = document.getElementById('new-problem-btn');
                    
                    checkBtn.style.backgroundColor = config.secondary_color || defaultConfig.secondary_color;
                    newProblemBtn.style.backgroundColor = config.primary_color || defaultConfig.primary_color;

                    // Font ayarları
                    document.body.style.fontFamily = `${customFont}, ${baseFontStack}`;
                    document.body.style.fontSize = `${baseSize}px`;
                    document.body.style.color = config.text_color || defaultConfig.text_color;
                },
                mapToCapabilities: (config) => ({
                    recolorables: [
                        {
                            get: () => config.background_color || defaultConfig.background_color,
                            set: (value) => {
                                if (window.elementSdk) {
                                    window.elementSdk.setConfig({ background_color: value });
                                }
                            }
                        },
                        {
                            get: () => config.primary_color || defaultConfig.primary_color,
                            set: (value) => {
                                if (window.elementSdk) {
                                    window.elementSdk.setConfig({ primary_color: value });
                                }
                            }
                        },
                        {
                            get: () => config.secondary_color || defaultConfig.secondary_color,
                            set: (value) => {
                                if (window.elementSdk) {
                                    window.elementSdk.setConfig({ secondary_color: value });
                                }
                            }
                        },
                        {
                            get: () => config.text_color || defaultConfig.text_color,
                            set: (value) => {
                                if (window.elementSdk) {
                                    window.elementSdk.setConfig({ text_color: value });
                                }
                            }
                        },
                        {
                            get: () => config.accent_color || defaultConfig.accent_color,
                            set: (value) => {
                                if (window.elementSdk) {
                                    window.elementSdk.setConfig({ accent_color: value });
                                }
                            }
                        }
                    ],
                    borderables: [],
                    fontEditable: {
                        get: () => config.font_family || defaultConfig.font_family,
                        set: (value) => {
                            if (window.elementSdk) {
                                window.elementSdk.setConfig({ font_family: value });
                            }
                        }
                    },
                    fontSizeable: {
                        get: () => config.font_size || defaultConfig.font_size,
                        set: (value) => {
                            if (window.elementSdk) {
                                window.elementSdk.setConfig({ font_size: value });
                            }
                        }
                    }
                }),
                mapToEditPanelValues: (config) => new Map([
                    ["app_title", config.app_title || defaultConfig.app_title],
                    ["check_button_text", config.check_button_text || defaultConfig.check_button_text],
                    ["new_problem_text", config.new_problem_text || defaultConfig.new_problem_text]
                ])
            });
        }

        // Basamak sayısına göre rastgele sayı üretme
        function generateNumberByDigits(digits) {
            if (digits === 1) {
                return Math.floor(Math.random() * 9) + 1; // 1-9
            } else if (digits === 2) {
                return Math.floor(Math.random() * 90) + 10; // 10-99
            } else if (digits === 3) {
                return Math.floor(Math.random() * 900) + 100; // 100-999
            }
            return 100; // varsayılan
        }

        // Tek problem oluşturma
        function generateSingleProblem() {
            let num1, num2, result;
            let maxAttempts = 100;
            let attempts = 0;
            
            if (currentProblemType.startsWith('addition')) {
                // Toplama işlemi
                do {
                    num1 = generateNumberByDigits(currentDigitCount);
                    num2 = generateNumberByDigits(currentDigitCount);
                    result = num1 + num2;
                    attempts++;
                    
                    // Sonucun makul bir aralıkta olmasını sağla
                    let maxResult = currentDigitCount === 1 ? 18 : 
                                   currentDigitCount === 2 ? 198 : 1998;
                } while ((result > maxResult || result < 2) && attempts < maxAttempts);
                
                return { num1, num2, result, operation: 'addition' };
            } else {
                // Çıkarma işlemi
                do {
                    num1 = generateNumberByDigits(currentDigitCount);
                    num2 = generateNumberByDigits(currentDigitCount);
                    
                    // num1'in num2'den büyük olmasını sağla
                    if (num1 < num2) {
                        [num1, num2] = [num2, num1];
                    }
                    
                    result = num1 - num2;
                    attempts++;
                } while (result < 0 && attempts < maxAttempts);
                
                return { num1, num2, result, operation: 'subtraction' };
            }
        }

        // Çoklu problem oluşturma
        function generateProblems() {
            currentProblems = [];
            for (let i = 0; i < currentProblemCount; i++) {
                currentProblems.push(generateSingleProblem());
            }
            displayProblems();
        }

        // Tek problem görüntüleme
        function displaySingleProblem(problem, index) {
            const operationSign = problem.operation === 'addition' ? '+' : '−';
            const operationClass = problem.operation === 'addition' ? 'plus-sign' : 'minus-sign';
            
            // A4 çalışma sayfası için boyut ayarları
            const isCompactMode = currentProblemCount > 6;
            const cardPadding = isCompactMode ? 'p-2' : 'p-4';
            const minHeight = isCompactMode ? 'min-h-[120px]' : 'min-h-[180px]';
            const fontSize = isCompactMode ? Math.max(12, currentFontSize - 6) : currentFontSize;
            const inputWidth = isCompactMode ? '60px' : '80px';
            const inputHeight = isCompactMode ? '35px' : '50px';
            const minWidth = isCompactMode ? '80px' : '120px';
            const questionFontSize = isCompactMode ? 'text-xs' : 'text-sm';
            
            let html = '';
            
            if (currentLayout === 'vertical') {
                if (currentProblemType.endsWith('-result')) {
                    // Sonucu bul
                    html = `
                        <div class="problem-card bg-white rounded border ${cardPadding} ${minHeight} flex flex-col justify-center items-center" style="font-size: ${fontSize}px; font-weight: bold; font-family: 'Courier New', monospace;">
                            <div class="${questionFontSize} text-gray-500 mb-1 self-start">Soru ${index + 1}</div>
                            <div class="flex flex-col items-center justify-center flex-1">
                                <div style="text-align: center; margin-bottom: 6px; min-width: ${minWidth};">${problem.num1}</div>
                                <div style="display: flex; align-items: center; margin-bottom: 6px; min-width: ${minWidth}; position: relative;">
                                    <span style="text-align: center; width: 100%;">${problem.num2}</span>
                                </div>
                                <div style="position: relative; width: ${minWidth};">
                                    <span class="${operationClass}" style="font-size: ${fontSize + 4}px; position: absolute; left: 0; top: -${Math.floor(fontSize * 1.2)}px;">${operationSign}</span>
                                    <div class="line-under" style="width: 100%; margin: 0; height: 2px;"></div>
                                </div>
                                <div style="text-align: center; margin-top: 6px; min-width: ${minWidth};">
                                    <input type="number" class="math-input" id="answer-input-${index}" placeholder="?" style="font-size: ${fontSize}px; width: ${inputWidth}; height: ${inputHeight}; text-align: center; border: 1px solid #e5e7eb; border-radius: 4px;">
                                </div>
                            </div>
                        </div>
                    `;
                } else if (currentProblemType === 'addition-first-addend' || currentProblemType === 'subtraction-minuend') {
                    // 1. toplanı bul veya eksileni bul
                    html = `
                        <div class="problem-card bg-white rounded border ${cardPadding} ${minHeight} flex flex-col justify-center items-center" style="font-size: ${fontSize}px; font-weight: bold; font-family: 'Courier New', monospace;">
                            <div class="${questionFontSize} text-gray-500 mb-1 self-start">Soru ${index + 1}</div>
                            <div class="flex flex-col items-center justify-center flex-1">
                                <div style="text-align: center; margin-bottom: 6px; min-width: ${minWidth};">
                                    <input type="number" class="math-input" id="answer-input-${index}" placeholder="?" style="font-size: ${fontSize}px; width: ${inputWidth}; height: ${inputHeight}; text-align: center; border: 1px solid #e5e7eb; border-radius: 4px;">
                                </div>
                                <div style="display: flex; align-items: center; margin-bottom: 6px; min-width: ${minWidth}; position: relative;">
                                    <span style="text-align: center; width: 100%;">${problem.num2}</span>
                                </div>
                                <div style="position: relative; width: ${minWidth};">
                                    <span class="${operationClass}" style="font-size: ${fontSize + 4}px; position: absolute; left: 0; top: -${Math.floor(fontSize * 1.2)}px;">${operationSign}</span>
                                    <div class="line-under" style="width: 100%; margin: 0; height: 2px;"></div>
                                </div>
                                <div style="text-align: center; margin-top: 6px; min-width: ${minWidth};">${problem.result}</div>
                            </div>
                        </div>
                    `;
                } else if (currentProblemType === 'addition-second-addend' || currentProblemType === 'subtraction-subtrahend') {
                    // 2. toplanı bul veya çıkanı bul
                    html = `
                        <div class="problem-card bg-white rounded border ${cardPadding} ${minHeight} flex flex-col justify-center items-center" style="font-size: ${fontSize}px; font-weight: bold; font-family: 'Courier New', monospace;">
                            <div class="${questionFontSize} text-gray-500 mb-1 self-start">Soru ${index + 1}</div>
                            <div class="flex flex-col items-center justify-center flex-1">
                                <div style="text-align: center; margin-bottom: 6px; min-width: ${minWidth};">${problem.num1}</div>
                                <div style="display: flex; align-items: center; margin-bottom: 6px; min-width: ${minWidth}; position: relative;">
                                    <div style="text-align: center; width: 100%;">
                                        <input type="number" class="math-input" id="answer-input-${index}" placeholder="?" style="font-size: ${fontSize}px; width: ${inputWidth}; height: ${inputHeight}; text-align: center; border: 1px solid #e5e7eb; border-radius: 4px;">
                                    </div>
                                </div>
                                <div style="position: relative; width: ${minWidth};">
                                    <span class="${operationClass}" style="font-size: ${fontSize + 4}px; position: absolute; left: 0; top: -${Math.floor(fontSize * 1.2)}px;">${operationSign}</span>
                                    <div class="line-under" style="width: 100%; margin: 0; height: 2px;"></div>
                                </div>
                                <div style="text-align: center; margin-top: 6px; min-width: ${minWidth};">${problem.result}</div>
                            </div>
                        </div>
                    `;
                }
            } else {
                // Yatay düzen için optimized boyutlar
                const horizontalHeight = isCompactMode ? 'h-[70px]' : 'h-[100px]';
                const gap = isCompactMode ? '6px' : '12px';
                const cardWidth = isCompactMode ? 'w-[240px]' : 'w-[320px]';
                
                if (currentProblemType.endsWith('-result')) {
                    // Sonucu bul - yatay düzen
                    html = `
                        <div class="problem-card bg-white rounded border ${cardPadding} ${horizontalHeight} ${cardWidth} flex flex-col justify-center mx-auto">
                            <div class="${questionFontSize} text-gray-500 mb-1 text-center">Soru ${index + 1}</div>
                            <div class="flex-1 flex items-center justify-center">
                                <div style="font-size: ${fontSize}px; font-weight: bold; display: flex; align-items: center; gap: ${gap}; flex-wrap: nowrap; justify-content: center;">
                                    <span style="min-width: ${isCompactMode ? '40px' : '50px'}; text-align: center;">${problem.num1}</span>
                                    <span class="${operationClass}" style="font-size: ${fontSize + 2}px; min-width: ${isCompactMode ? '20px' : '25px'}; text-align: center;">${operationSign}</span>
                                    <span style="min-width: ${isCompactMode ? '40px' : '50px'}; text-align: center;">${problem.num2}</span>
                                    <span class="equals-sign" style="font-size: ${fontSize + 2}px; min-width: ${isCompactMode ? '20px' : '25px'}; text-align: center;">=</span>
                                    <input type="number" class="math-input" id="answer-input-${index}" placeholder="?" style="font-size: ${fontSize}px; width: ${inputWidth}; height: ${inputHeight}; border: 1px solid #e5e7eb; border-radius: 4px;">
                                </div>
                            </div>
                        </div>
                    `;
                } else if (currentProblemType === 'addition-first-addend' || currentProblemType === 'subtraction-minuend') {
                    // 1. toplanı bul veya eksileni bul
                    html = `
                        <div class="problem-card bg-white rounded border ${cardPadding} ${horizontalHeight} ${cardWidth} flex flex-col justify-center mx-auto">
                            <div class="${questionFontSize} text-gray-500 mb-1 text-center">Soru ${index + 1}</div>
                            <div class="flex-1 flex items-center justify-center">
                                <div style="font-size: ${fontSize}px; font-weight: bold; display: flex; align-items: center; gap: ${gap}; flex-wrap: nowrap; justify-content: center;">
                                    <input type="number" class="math-input" id="answer-input-${index}" placeholder="?" style="font-size: ${fontSize}px; width: ${inputWidth}; height: ${inputHeight}; border: 1px solid #e5e7eb; border-radius: 4px;">
                                    <span class="${operationClass}" style="font-size: ${fontSize + 2}px; min-width: ${isCompactMode ? '20px' : '25px'}; text-align: center;">${operationSign}</span>
                                    <span style="min-width: ${isCompactMode ? '40px' : '50px'}; text-align: center;">${problem.num2}</span>
                                    <span class="equals-sign" style="font-size: ${fontSize + 2}px; min-width: ${isCompactMode ? '20px' : '25px'}; text-align: center;">=</span>
                                    <span style="min-width: ${isCompactMode ? '40px' : '50px'}; text-align: center;">${problem.result}</span>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // 2. toplanı bul veya çıkanı bul
                    html = `
                        <div class="problem-card bg-white rounded border ${cardPadding} ${horizontalHeight} ${cardWidth} flex flex-col justify-center mx-auto">
                            <div class="${questionFontSize} text-gray-500 mb-1 text-center">Soru ${index + 1}</div>
                            <div class="flex-1 flex items-center justify-center">
                                <div style="font-size: ${fontSize}px; font-weight: bold; display: flex; align-items: center; gap: ${gap}; flex-wrap: nowrap; justify-content: center;">
                                    <span style="min-width: ${isCompactMode ? '40px' : '50px'}; text-align: center;">${problem.num1}</span>
                                    <span class="${operationClass}" style="font-size: ${fontSize + 2}px; min-width: ${isCompactMode ? '20px' : '25px'}; text-align: center;">${operationSign}</span>
                                    <input type="number" class="math-input" id="answer-input-${index}" placeholder="?" style="font-size: ${fontSize}px; width: ${inputWidth}; height: ${inputHeight}; border: 1px solid #e5e7eb; border-radius: 4px;">
                                    <span class="equals-sign" style="font-size: ${fontSize + 2}px; min-width: ${isCompactMode ? '20px' : '25px'}; text-align: center;">=</span>
                                    <span style="min-width: ${isCompactMode ? '40px' : '50px'}; text-align: center;">${problem.result}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
            
            return html;
        }

        // Çoklu problem görüntüleme
        function displayProblems() {
            const container = document.getElementById('problem-container');
            
            // A4 çalışma sayfası düzeni için grid ayarları
            let gridClass = '';
            if (currentProblemCount <= 2) {
                gridClass = 'grid-cols-1 md:grid-cols-2';
            } else if (currentProblemCount <= 6) {
                gridClass = 'grid-cols-2 md:grid-cols-3';
            } else if (currentProblemCount <= 12) {
                gridClass = 'grid-cols-3 md:grid-cols-4';
            } else if (currentProblemCount <= 20) {
                gridClass = 'grid-cols-4 md:grid-cols-5';
            } else if (currentProblemCount <= 30) {
                gridClass = 'grid-cols-5 md:grid-cols-6';
            } else {
                gridClass = 'grid-cols-6 md:grid-cols-8';
            }
            container.className = `problem-grid grid gap-4 ${gridClass}`;
            
            let html = '';
            for (let i = 0; i < currentProblems.length; i++) {
                html += `<div class="problem-card-wrapper">${displaySingleProblem(currentProblems[i], i)}</div>`;
            }
            
            container.innerHTML = html;
            
            // Enter tuşu ile kontrol etme
            for (let i = 0; i < currentProblems.length; i++) {
                const answerInput = document.getElementById(`answer-input-${i}`);
                if (answerInput) {
                    answerInput.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') {
                            checkAnswers();
                        }
                    });
                }
            }
            
            // İlk input'a odaklan
            const firstInput = document.getElementById('answer-input-0');
            if (firstInput) {
                firstInput.focus();
            }
        }

        // Çoklu cevap kontrol etme
        function checkAnswers() {
            let correctCount = 0;
            let totalCount = currentProblems.length;
            let allAnswered = true;
            
            for (let i = 0; i < currentProblems.length; i++) {
                const answerInput = document.getElementById(`answer-input-${i}`);
                const problem = currentProblems[i];
                
                if (!answerInput || !answerInput.value) {
                    allAnswered = false;
                    continue;
                }
                
                const userAnswer = parseInt(answerInput.value);
                let correctAnswer;
                
                if (currentProblemType.endsWith('-result')) {
                    // Sonucu bul
                    correctAnswer = problem.result;
                } else if (currentProblemType === 'addition-first-addend' || currentProblemType === 'subtraction-minuend') {
                    // 1. toplanı bul veya eksileni bul
                    correctAnswer = problem.num1;
                } else {
                    // 2. toplanı bul veya çıkanı bul
                    correctAnswer = problem.num2;
                }
                
                if (userAnswer === correctAnswer) {
                    answerInput.classList.remove('incorrect');
                    answerInput.classList.add('correct');
                    correctCount++;
                } else {
                    answerInput.classList.remove('correct');
                    answerInput.classList.add('incorrect');
                }
            }
            
            if (!allAnswered) {
                showMessage('Lütfen tüm soruları cevaplayın!', 'warning');
                return;
            }
            
            if (correctCount === totalCount) {
                showMessage(`🎉 Mükemmel! ${correctCount}/${totalCount} doğru cevap!`, 'success');
            } else if (correctCount > totalCount / 2) {
                showMessage(`👍 İyi! ${correctCount}/${totalCount} doğru cevap!`, 'success');
            } else {
                showMessage(`📚 Tekrar deneyin! ${correctCount}/${totalCount} doğru cevap!`, 'error');
            }
        }

        // Mesaj gösterme
        function showMessage(message, type) {
            const resultMessage = document.getElementById('result-message');
            resultMessage.textContent = message;
            resultMessage.className = `mt-6 text-center text-lg font-semibold ${
                type === 'success' ? 'text-green-600' : 
                type === 'error' ? 'text-red-600' : 'text-yellow-600'
            }`;
            resultMessage.classList.remove('hidden');
            
            setTimeout(() => {
                resultMessage.classList.add('hidden');
            }, 3000);
        }

        // Event listeners
        document.getElementById('problem-type').addEventListener('change', function(e) {
            currentProblemType = e.target.value;
            generateProblems();
        });

        document.getElementById('problem-count').addEventListener('change', function(e) {
            currentProblemCount = parseInt(e.target.value);
            generateProblems();
        });

        document.getElementById('digit-count').addEventListener('change', function(e) {
            currentDigitCount = parseInt(e.target.value);
            generateProblems();
        });

        document.getElementById('layout-type').addEventListener('change', function(e) {
            currentLayout = e.target.value;
            displayProblems();
        });

        document.getElementById('font-size').addEventListener('change', function(e) {
            currentFontSize = parseInt(e.target.value);
            displayProblems();
        });

        document.getElementById('check-btn').addEventListener('click', checkAnswers);
        document.getElementById('new-problem-btn').addEventListener('click', generateProblems);

        // Sayfa yüklendiğinde ilk problemleri oluştur
        generateProblems();
    </script>
